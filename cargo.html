        <a href="route.html">경로 분석</a>

      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" aria-label="테마 전환"></button>
      </div>
    </div>
  </header>

  <!-- ================= 타이틀 ================= -->
  <section class="dash-hero">
    <div class="container">
      <div class="dash-title-row">
        <div>
          <h1>화물 추적 <span style="font-weight:300; opacity:.75;">— 해상·항공 수입 통관 진행</span></h1>
          <p class="dash-sub">MBL / HBL / AWB 번호로 관세청 통관 진행 상태를 조회합니다</p>
        </div>
      </div>
      <p class="dash-sub" style="margin-top:14px; font-size:12.5px;">
        데이터: 관세청 유니패스 화물통관진행정보 OpenAPI · 항공 수입은 AWB 번호를 MBL로 조회 · 수출/환적은 미지원
      </p>
    </div>
  </section>

  <!-- ============ 조회 ============ -->
  <section class="dash-section" id="trace">
    <div class="container">
      <div class="card reveal" style="margin-bottom:14px;">
        <div class="berth-toolbar" style="margin:0;">
          <div class="chip-row" id="typeChips" style="margin:0;">
            <button class="f-chip" data-t="mbl">MBL / AWB</button>
            <button class="f-chip off" data-t="hbl">HBL</button>
          </div>
          <input type="search" class="focus-search" id="blNo" placeholder="B/L 번호 (예: HDMU1234567 / 180-12345675)" style="max-width:320px;">
          <select id="blYear" class="focus-search" style="max-width:110px;">
            <option>2026</option><option>2025</option><option>2024</option>
          </select>
          <button class="btn btn-primary" id="traceBtn" type="button">조회</button>
        </div>
        <p class="sc-sub" id="awbHint" style="margin:10px 0 0; color:var(--muted); font-size:12px;"></p>
      </div>

      <div id="traceOut"></div>
    </div>
  </section>
