<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.vesselfinder.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://kvmyiualdodcvreoqfin.supabase.co https://api.open-meteo.com https://marine-api.open-meteo.com https://server.arcgisonline.com; frame-src 'self' https://www.vesselfinder.com; form-action 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()">
  <!-- 테마·언어 선반영: 저장된 값을 그리기 전에 적용해 페이지 이동 시 깜빡임을 없앤다.
       인라인이어야 의미가 있다(외부 파일은 네트워크를 한 번 더 기다린다). -->
  <script>/* 클릭재킹 방어 — GitHub Pages 는 X-Frame-Options 헤더를 못 주므로 스크립트로 막는다.
     우리 사이트가 iframe 에 박히면(top!==self) 최상위로 튕겨낸다. */
  (function(){try{if(top!==self){top.location=self.location.href;}}catch(e){try{document.documentElement.style.display='none';}catch(_){}}})();</script>
  <script>(function(){try{var t=localStorage.getItem('twl-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);var L={ko:'ko',en:'en',zh:'zh-CN',ja:'ja',ru:'ru'},l=localStorage.getItem('twl-lang');if(L[l])document.documentElement.setAttribute('lang',L[l]);}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pg.title.admin">관리자 — 회원 승인 | TWL Control Tower</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/twl_logo.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=2026-09-05i">
  <link rel="stylesheet" href="css/auth.css?v=2026-09-01s">
</head>
<body class="auth-page">
  <header class="site-header scrolled">
    <div class="header-inner">
      <a href="index.html" class="logo-slot" aria-label="태웅로직스 홈">
        <span class="logo-text"><b class="l1">TWL</b> <span class="l2">Control Tower</span></span>
      </a>
      <span class="admin-badge" data-i18n="ld.admin.badge">관리자</span>
      <a class="acct-btn" href="analytics.html" style="margin-left:auto" data-i18n="an.nav.stats">이용 통계</a>
      <button class="icon-btn theme-toggle" aria-label="테마 전환"></button>
      <a class="acct-btn" id="logoutBtn" href="javascript:void(0)" data-i18n="auth.logout">로그아웃</a>
    </div>
  </header>

  <main class="container admin-wrap">
    <div class="page-head">
      <h1 data-i18n="ld.admin.title">회원 승인 관리</h1>
      <p data-i18n="ld.admin.desc">가입 신청을 검토하고 승인/거부합니다. 승인된 계정만 로그인할 수 있습니다.</p>
    </div>

    <div class="admin-toolbar">
      <div class="seg" id="filterSeg">
        <button class="seg-btn active" data-f="pending" data-i18n="ld.admin.st.pending">승인대기</button>
        <button class="seg-btn" data-f="approved" data-i18n="ld.admin.st.approved">승인됨</button>
        <button class="seg-btn" data-f="all" data-i18n="ld.admin.filter.all">전체</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="reload" data-i18n="ld.common.refresh">새로고침</button>
    </div>

    <div id="adminMsg" class="auth-msg" hidden></div>

    <!-- 인증코드 대기 — 계열사 메일 게이트웨이에 막혀 코드가 안 닿을 때 관리자가 직접 전달한다.
         미사용·미만료 코드만 서버가 돌려준다(이미 쓴 코드는 노출하지 않는다). -->
    <details class="tbl-card" id="codeBox" style="margin-bottom:14px; padding:12px 16px;">
      <summary style="cursor:pointer; font-weight:700;">
        <span data-i18n="ld.admin.codes.h">인증코드 대기</span>
        <span class="muted" id="codeCount" style="font-weight:400;"></span>
      </summary>
      <p class="muted" style="font-size:var(--fs-sm); margin:8px 0 10px;" data-i18n="ld.admin.codes.desc">
        메일이 안 닿는 경우에만 직접 전달하십시오. 코드는 1회용이며 5회까지 시도할 수 있습니다.
      </p>
      <div style="overflow-x:auto">
        <table class="tw admin-tbl">
          <thead><tr>
            <th data-i18n="ld.admin.codes.th.login">이메일</th>
            <th data-i18n="ld.admin.codes.th.code">인증코드</th>
            <th data-i18n="ld.admin.codes.th.kind">용도</th>
            <th data-i18n="ld.admin.codes.th.left">남은시간</th>
            <th data-i18n="ld.admin.codes.th.try">시도</th>
            <th class="ta-r" data-i18n="ld.admin.th.act">관리</th>
          </tr></thead>
          <tbody id="codeRows"></tbody>
        </table>
      </div>
    </details>
    <div class="tbl-card" style="overflow-x:auto">
      <table class="tw admin-tbl">
        <thead><tr><th data-i18n="ld.admin.th.login">이메일(아이디)</th><th data-i18n="ld.admin.th.name">이름/부서</th><th data-i18n="ld.admin.th.status">상태</th><th data-i18n="ld.admin.th.role">권한</th><th data-i18n="ld.admin.th.security">보안</th><th data-i18n="ld.admin.th.created">신청일</th><th class="ta-r" data-i18n="ld.admin.th.act">관리</th></tr></thead>
        <tbody id="userRows"><tr><td colspan="7" class="muted" style="text-align:center;padding:24px" data-i18n="ld.admin.loading">불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </main>

  <script src="js/common.js?v=2026-09-04w"></script>
  <script src="js/menu.js?v=2026-09-04w"></script>
  <script src="js/i18n.js?v=2026-09-05i"></script>
  <script src="js/auth.js?v=2026-09-04s"></script>
  <script src="js/track.js?v=2026-08-31v"></script>
  <script>
    (function () {
      var A = window.TWAUTH, filter = 'pending', ALL = [];
      function t(k, ko) { return (window.TWI18N && window.TWI18N.t) ? window.TWI18N.t(k, ko) : ko; }
      var rows = document.getElementById('userRows'), msg = document.getElementById('adminMsg');
      function show(t, k) { msg.hidden = false; msg.textContent = t; msg.className = 'auth-msg ' + (k || ''); setTimeout(function () { msg.hidden = true; }, 3500); }
      function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      var ST = { pending: '승인대기', approved: '승인됨', rejected: '거부' };

      /* 관리자 권한 확인 */
      if (!A.isAuthed()) { location.replace('login.html'); return; }
      A.validate().then(function (ok) {
        /* 서버에 못 닿은 것은 '권한 없음' 이 아니다. 예전엔 순단 한 번에 '관리자만 접근할 수
           있습니다' 를 띄우고 로그인으로 튕겼다 — 세션은 멀쩡한데도. 사유를 나눠 안내만 하고
           머무른다(새로고침하면 회복된다). */
        if (!ok && A.lastError && A.lastError() === 'net') { alert(t('ld.admin.alert.netErr', '서버에 연결하지 못해 권한을 확인할 수 없습니다. 잠시 후 새로고침해 주세요.')); return; }
        if (!ok || A.role() !== 'admin') { alert(t('ld.admin.alert.adminOnly', '관리자만 접근할 수 있습니다.')); location.replace('login.html'); return; }
        load();
        loadCodes();
        /* 동적으로 그린 표는 사전 적용 대상이 아니라, 언어가 바뀌면 다시 그려야 한다.
           안 그러면 낱말 번역기가 끼어들어 '30분 extended' 같은 잡종이 남는다. */
        window.addEventListener('twl:langchange', function () { load(); loadCodes(); });
      });

      document.getElementById('logoutBtn').onclick = function () { A.logout().then(function () { location.href = 'login.html'; }); };
      document.getElementById('reload').onclick = function () { load(); loadCodes(); };

      /* ── 인증코드 대기 ────────────────────────────────────────────────
         계열사 메일 게이트웨이가 인증코드 메일을 격리하는 경우가 있어(2026-08-31 실제 발생),
         관리자가 코드를 직접 확인해 전달할 수 있게 둔다.
         재발송하면 새 코드가 나가 이미 전달한 코드가 무효가 되므로, 연장 버튼을 따로 둔다. */
      var codeRows = document.getElementById('codeRows');
      var codeCount = document.getElementById('codeCount');

      function loadCodes() {
        A.adminPendingCodes().then(function (r) {
          if (!r || r.error) {
            codeRows.innerHTML = '<tr><td colspan="6" class="muted" style="padding:14px">' +
              esc((r && r.error) || t('ld.admin.codes.fail', '인증코드를 불러오지 못했습니다.')) + '</td></tr>';
            return;
          }
          var list = r.items || [];
          codeCount.textContent = ' · ' + list.length +
            ((window.TWI18N && TWI18N.u) ? TWI18N.u(list.length, 'cg.unit.count', '건') : t('cg.unit.count', '건'));
          if (!list.length) {
            codeRows.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;padding:18px">' +
              t('ld.admin.codes.empty', '대기 중인 인증코드가 없습니다.') + '</td></tr>';
            return;
          }
          codeRows.innerHTML = list.map(function (c) {
            var kind = c.purpose === 'reset'
              ? t('ld.admin.codes.reset', '비밀번호 재설정') : t('ld.admin.codes.signup', '가입');
            return '<tr><td><b>' + esc(c.login_id) + '</b>' +
              (c.already_user ? ' <span class="muted">(' + t('ld.admin.codes.exists', '기존 계정') + ')</span>' : '') + '</td>' +
              '<td><code style="font-size:15px; letter-spacing:2px;">' + esc(c.code) + '</code></td>' +
              '<td>' + esc(kind) + '</td>' +
              '<td>' + c.minutes_left + t('ld.admin.codes.min', '분') + '</td>' +
              '<td>' + c.attempts + ' / 5</td>' +
              '<td class="ta-r"><button class="btn btn-ghost btn-xs" data-i18n="ld.admin.codes.extend" data-ext="' + esc(c.id) + '">' +
              t('ld.admin.codes.extend', '30분 연장') + '</button></td></tr>';
          }).join('');
          codeRows.querySelectorAll('[data-ext]').forEach(function (b) {
            b.onclick = function () {
              b.disabled = true;
              A.adminExtendCode(b.dataset.ext).then(function (r2) {
                show(r2 && r2.ok
                  ? t('ld.admin.codes.extended', '유효시간을 30분 연장했습니다.')
                  : ((r2 && r2.error) || t('ld.admin.msg.fail', '실패')), r2 && r2.ok ? 'ok' : 'err');
                loadCodes();
              });
            };
          });
        });
      }
      document.querySelectorAll('#filterSeg .seg-btn').forEach(function (b) {
        b.onclick = function () { document.querySelectorAll('#filterSeg .seg-btn').forEach(function (x) { x.classList.remove('active'); }); b.classList.add('active'); filter = b.dataset.f; render(); };
      });

      function load() {
        rows.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">' + t('ld.admin.loading', '불러오는 중…') + '</td></tr>';
        A.adminList().then(function (r) {
          if (!Array.isArray(r)) { show(r && r.error ? r.error : t('ld.admin.msg.listFail', '목록 조회 실패'), 'err'); return; }
          ALL = r; render();
        });
      }
      function render() {
        var list = ALL.filter(function (u) { return filter === 'all' ? true : u.status === filter; });
        if (!list.length) { rows.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">' + t('ld.admin.empty', '해당 항목이 없습니다.') + '</td></tr>'; return; }
        rows.innerHTML = list.map(function (u) {
          var d = u.created_at ? new Date(u.created_at) : null;
          var ds = d ? (d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2)) : '—';
          var isAdmin = u.role === 'admin';
          var sec = u.security_status || 'normal';
          var secLb = sec === 'blocked' ? t('ld.admin.sec.blocked', '차단') : (sec === 'watch' ? t('ld.admin.sec.watch', '주의') : t('ld.admin.sec.normal', '정상'));
          var secTitle = [
            t('ld.admin.sec.risk', '위험도') + ': ' + (u.risk_score || 0),
            u.last_ip ? 'IP: ' + u.last_ip : '',
            u.blocked_reason ? t('ld.admin.sec.reason', '사유') + ': ' + u.blocked_reason : ''
          ].filter(Boolean).join(' · ');
          var secCell = '<span class="st-pill st-' + (sec === 'blocked' ? 'rejected' : sec === 'watch' ? 'pending' : 'approved') + '" title="' + esc(secTitle) + '">' + esc(secLb) + '</span>';
          var act = isAdmin ? '<span class="muted">' + t('ld.admin.role.admin', '관리자') + '</span>' :
            '<div class="row-act">' +
              (u.status !== 'approved' ? '<button class="btn btn-primary btn-xs" data-act="approved" data-id="' + u.id + '" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.approve', '승인') + '</button>' : '') +
              (u.status !== 'rejected' ? '<button class="btn btn-ghost btn-xs" data-act="rejected" data-id="' + u.id + '" data-cur="' + esc(u.status) + '">' + (u.status === 'approved' ? t('ld.admin.btn.revoke', '승인취소') : t('ld.admin.btn.reject', '거부')) + '</button>' : '') +
              (sec !== 'blocked' ? '<button class="btn btn-ghost btn-xs" data-act="block" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.block', '보안차단') + '</button>' : '<button class="btn btn-ghost btn-xs" data-act="unblock" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.unblock', '차단해제') + '</button>') +
              (sec !== 'watch' && sec !== 'blocked' ? '<button class="btn btn-ghost btn-xs" data-act="watch" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.watch', '주의') + '</button>' : '') +
              '<button class="btn btn-ghost btn-xs" data-act="reset" data-id="' + u.id + '">' + t('ld.admin.btn.resetPw', '비번재설정') + '</button>' +
            '</div>';
          return '<tr><td><b>' + esc(u.login) + '</b></td><td>' + esc(u.name || '—') + '</td>' +
            '<td><span class="st-pill st-' + u.status + '">' + t('ld.admin.st.' + u.status, ST[u.status] || u.status) + '</span></td>' +
            '<td>' + (isAdmin ? t('ld.admin.role.admin', '관리자') : t('ld.admin.role.user', '일반')) + '</td><td>' + secCell + '</td><td>' + ds + '</td><td class="ta-r">' + act + '</td></tr>';
        }).join('');
        rows.querySelectorAll('[data-act]').forEach(function (b) {
          b.onclick = function () {
            var id = b.dataset.id, act = b.dataset.act;
            if (act === 'reset') {
              var pw = prompt(t('ld.admin.prompt.newPw', '새 임시 비밀번호를 입력하세요 (8자 이상, 특수문자 포함).'));
              if (!pw) return;
              var s = A.pwStrength(pw);
              if (!s.ok) { show(t('auth.msg.pwRule', '비밀번호는 8자 이상 + 특수문자를 포함해야 합니다.'), 'err'); return; }
              A.adminResetPw(id, pw).then(function (r) { show(r && r.ok ? t('ld.admin.msg.pwReset', '비밀번호를 재설정했습니다.') : (r.error || t('ld.admin.msg.fail', '실패')), r && r.ok ? 'ok' : 'err'); });
            } else {
              if (act === 'block' || act === 'unblock' || act === 'watch') {
                var login = b.dataset.login;
                var next = act === 'block' ? 'blocked' : (act === 'watch' ? 'watch' : 'normal');
                var reason = act === 'block' ? prompt(t('ld.admin.prompt.blockReason', '차단 사유를 입력하세요.'), t('ld.admin.sec.manual', '관리자 수동 차단')) : null;
                if (act === 'block' && reason === null) return;
                A.adminSetSecurity(login, next, reason).then(function (r) {
                  if (r && r.ok) { show(t('ld.admin.msg.securitySaved', '보안 상태를 변경했습니다.'), 'ok'); load(); }
                  else { show(r && r.error ? r.error : t('ld.admin.msg.fail', '실패'), 'err'); }
                });
                return;
              }
              /* 승인취소는 이제 그 사람의 로그인 세션까지 즉시 끊는다(2026-09-03).
                 재승인해도 끊긴 세션은 돌아오지 않는다 — 전 기기 재로그인이 필요하다.
                 같은 줄의 다른 위험 동작(보안차단·비번재설정)은 이미 확인 절차가 있는데
                 이것만 확인 없이 즉시 실행됐다. 부작용을 명시해 되묻는다. */
              if (act === 'rejected' && b.getAttribute('data-cur') === 'approved' &&
                  !confirm(t('ld.admin.confirm.revoke',
                            '승인을 취소하면 이 계정의 로그인 세션이 모든 기기에서 즉시 종료됩니다.\n다시 승인해도 세션은 복구되지 않아 재로그인이 필요합니다.\n계속할까요?'))) {
                return;
              }
              var acctLogin = b.getAttribute('data-login') || (b.closest('tr') && b.closest('tr').getAttribute('data-login')) || '';
              A.adminSetStatus(id, act).then(function (r) {
                if (r && r.ok) {
                  show(act === 'approved' ? t('ld.admin.msg.approved', '승인했습니다.') : t('ld.admin.msg.rejected', '거부했습니다.'), 'ok');
                  /* 승인한 경우에만 신청자에게 "승인됐습니다" 메일. 서버가 관리자 토큰과 대상
                     상태를 다시 검증하므로, 실패해도 승인 자체는 이미 반영됐다 — 흐름을 막지 않는다. */
                  if (act === 'approved' && acctLogin && A.signupNotifyApproved) A.signupNotifyApproved(acctLogin).catch(function () {});
                  load();
                } else { show(r && r.error ? r.error : t('ld.admin.msg.fail', '실패'), 'err'); }
              });
            }
          };
        });
      }
    })();
  </script>
</body>
</html>
