  <style>html[data-auth-state="pending"] body { visibility: hidden; pointer-events: none; }</style>
  <style>
    /* 임시 비밀번호 모달 — 상자·버튼은 세션 만료 대화상자(.sess-mask/.sess-box)와
       입력은 로그인 폼(.auth-form)의 기존 규칙을 그대로 쓴다. 여기서는 그 둘을
       잇는 최소한만 정의한다. 새 색·새 크기는 만들지 않고 토큰만 쓴다. */
    /* 보안차단 대화상자(.adm-dlg)도 같은 규칙을 쓴다 — 한 화면에서 상자마다 간격이
       다르면 같은 물건으로 안 보인다. 값은 그대로 두고 선택자만 넓힌다. */
    .pwd-dlg .auth-form, .adm-dlg .auth-form { gap: var(--sp-2); margin: 0 0 var(--sp-3); }
    /* 오류는 그 입력 **바로 아래**에 붙는다 — 상단 토스트로만 알리면 어느 칸이
       틀렸는지 알 수 없다. 색만으로 알리지 않도록 문구를 항상 함께 띄운다. */
    .pwd-err { margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--lv-congested-txt); }
    .pwd-err[hidden] { display: none; }
    .pwd-dlg .auth-form input[aria-invalid="true"] { border-color: var(--lv-congested); }

    /* ── 헤더가 컨트롤을 화면 밖으로 밀지 않게 (2026-09-08) ──────────────────
       이 화면 헤더는 로고·배지·이동링크·언어·모션·테마·로그아웃을 한 줄에 세운다.
       언어 스위처를 넣으면서(그리고 .header-actions 가 생기며 모션 토글까지 딸려 오면서)
       한 줄 길이가 ko 778px · ru 921px 이 됐다. ≤640 은 css/style.css 가 이미 sticky +
       줄바꿈으로 받아 두었는데, 641~1199 구간은 헤더가 fixed·한 줄이라 넘친 만큼
       그대로 잘렸다 — 실측(2026-09-08): 768px 한국어에서 '로그아웃', 900px 러시아어에서
       'Выход' 가 화면 밖으로 나갔고 body 가 가로 스크롤을 만들지 않아 되찾을 수 없었다.
       → 그 구간까지 같은 처방을 넓힌다. sticky·top:0 이라 화면에 붙어 있는 것은 fixed 와
         똑같고(기능을 빼지 않는다), 대신 제 높이만큼 자리를 차지해 본문이 언제나 그
         아래에서 시작한다. 그래서 본문 위 여백에서 헤더 높이(64px)를 뺀다 — 안 빼면
         한 줄로 들어가는 언어에서 빈 띠가 생겨 화면이 없는 말을 하게 된다.
       ≤640 은 css/style.css 담당 구간이라 건드리지 않는다(그래서 min-width:641px). */
    @media (min-width: 641px) and (max-width: 1199px) {
      .auth-page .site-header { position: sticky; height: auto; }
      .auth-page .header-inner {
        flex-wrap: wrap; align-content: center; row-gap: var(--sp-1);
        height: auto; min-height: var(--header-h); padding-block: var(--sp-1);
      }
      .auth-page .header-actions { flex-wrap: wrap; flex: 0 1 auto; min-width: 0; row-gap: var(--sp-0); }
      /* auth.css 의 calc(--header-h + --sp-5) 에서 헤더 높이를 뺀 값 */
      .auth-page .admin-wrap { padding-top: var(--sp-5); }
    }

    /* ── 좁은 폭: 표를 카드로 접는다 (2026-09-08) ─────────────────────────
       375px 실측 — 회원 표 855~1150px vs 보이는 폭 325px. '관리' 열(승인·거부·보안차단·
       주의·비번재설정)이 통째로 화면 밖이라 버튼 4개 중 화면 안에 든 것이 0개였고,
       오른쪽 끝까지 밀면 이번엔 이메일·이름 열이 밖으로 나가 누구 줄인지 모른 채
       승인을 누르게 됐다. 가로 스크롤 상자(.tbl-card)는 이미 있었지만 그것만으로는
       '한 화면에 계정과 버튼이 같이 보인다' 를 만들 수 없다.
       → 열을 숨기지 않는다. 행을 카드로 세워 8개 값과 5개 버튼을 전부 그대로 보인다
         (각 칸은 data-th 로 자기 열 이름을 들고 있다 — thead 는 이 구간에서 감춘다).
       특이도 메모: table.tw td 규칙(nowrap·padding)을 확실히 이기려고 선택자를
       table.tw.adm-cards 로 겹쳐 적는다. 이 <style> 은 style.css 뒤에 온다. */
    @media (max-width: 640px) {
      table.tw.adm-cards { display: block; min-width: 0; width: 100%; }
      table.tw.adm-cards thead { display: none; }
      table.tw.adm-cards tbody { display: block; }
      table.tw.adm-cards tbody tr {
        display: block; border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface-2); padding: 10px 12px; margin: 0 0 10px;
      }
      table.tw.adm-cards tbody tr:last-child { margin-bottom: 0; }
      table.tw.adm-cards tbody td {
        display: grid; grid-template-columns: minmax(72px, 33%) minmax(0, 1fr);
        gap: 10px; align-items: baseline;
        padding: 4px 0; border: 0; white-space: normal; word-break: break-word;
      }
      table.tw.adm-cards tbody td::before {
        content: attr(data-th); color: var(--muted);
        font-size: var(--fs-xs); font-weight: 700; line-height: 1.5;
      }
      /* '관리' 칸만 한 줄을 통째로 쓴다 — 버튼 5개를 33% 칸에 밀어 넣으면 글자가 접힌다 */
      table.tw.adm-cards tbody td.act {
        grid-template-columns: minmax(0, 1fr); gap: 6px; text-align: left;
        margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--border);
      }
      table.tw.adm-cards tbody td.act .row-act { display: flex; flex-wrap: wrap; gap: 6px; }
      table.tw.adm-cards tbody td.act .btn { flex: 0 0 auto; }
      /* 안내 한 줄(불러오는 중·오류·해당 없음)은 카드가 아니라 그냥 한 칸이다 */
      table.tw.adm-cards tbody td[colspan] { display: block; text-align: center; }
      table.tw.adm-cards tbody td[colspan]::before { content: none; }
    }
  </style>

  <!-- ★ 이 화면은 외부 스크립트 뒤에 인라인 <script> 가 온다. defer 를 붙이면 인라인이

    <div class="tbl-card" style="overflow-x:auto">

  <script>
    (function () {
      var A = window.TWAUTH, filter = 'pending', ALL = [];
      function t(k, ko) { return (window.TWI18N && window.TWI18N.t) ? window.TWI18N.t(k, ko) : ko; }
      var rows = document.getElementById('userRows'), msg = document.getElementById('adminMsg');
      function show(t, k) { msg.hidden = false; msg.textContent = t; msg.className = 'auth-msg ' + (k || ''); setTimeout(function () { msg.hidden = true; }, 3500); }
      function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      var ST = { pending: '승인대기', approved: '승인됨', rejected: '거부' };

      /* 숫자·날짜 서식은 공용 API 로 통일한다. 예전엔 toLocaleString('ko-KR') 처럼
         언어가 코드에 박혀 있거나(다른 언어로 봐도 한국식) 값이 없을 때 0 을 지어냈다.
         nf/dt 는 없는 값에 '-' 를 돌려주고, dt 는 시간대를 KST 로 고정한다.
         ★ 전역이 아직/영영 없을 수 있으므로 항상 방어적으로 잡는다. */
      function nf(n, o) {
        if (window.TWI18N && TWI18N.nf) return TWI18N.nf(n, o);
        if (n == null || n === '' || !isFinite(Number(n))) return '-';
        return String(n);
      }

      /* The shared guard verifies server-side admin permissions before loading data. */
      TWL_READY(function () {
        load();
        loadCodes();
        /* 동적으로 그린 표는 사전 적용 대상이 아니라, 언어가 바뀌면 다시 그려야 한다.
           안 그러면 낱말 번역기가 끼어들어 '30분 extended' 같은 잡종이 남는다. */
        window.addEventListener('twl:langchange', function () { load(); loadCodes(); });
      });

      document.getElementById('logoutBtn').onclick = function () { A.logout(); };
      document.getElementById('reload').onclick = function () { load(); loadCodes(); };

      /* ── 인증코드 대기 ────────────────────────────────────────────────
         계열사 메일 게이트웨이가 인증코드 메일을 격리하는 경우가 있어(2026-08-31 실제 발생),
         관리자가 코드를 직접 확인해 전달할 수 있게 둔다.
         재발송하면 새 코드가 나가 이미 전달한 코드가 무효가 되므로, 연장 버튼을 따로 둔다. */
      var codeRows = document.getElementById('codeRows');
      var codeCount = document.getElementById('codeCount');

      function codeNote(html) {
        codeRows.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;padding:14px">' + html + '</td></tr>';
      }

      function loadCodes() {
        A.adminPendingCodes().then(function (r) {
          if (!r || r.error) {
            codeNote(esc((r && r.error) || t('ld.admin.codes.fail', '인증코드를 불러오지 못했습니다.')));
            return;
          }
          var list = r.items || [];
          codeCount.textContent = ' · ' + nf(list.length) +
            ((window.TWI18N && TWI18N.u) ? TWI18N.u(list.length, 'cg.unit.count', '건') : t('cg.unit.count', '건'));
          if (!list.length) { codeNote(t('ld.admin.codes.empty', '대기 중인 인증코드가 없습니다.')); return; }
          codeRows.innerHTML = list.map(function (c) {
            var kind = c.purpose === 'reset'
              ? t('ld.admin.codes.reset', '비밀번호 재설정') : t('ld.admin.codes.signup', '가입');
            /* data-th — 좁은 폭에서 행이 카드로 접힐 때 각 칸이 스스로 자기 열 이름을 단다
               (thead 가 사라지므로 값만 남으면 무슨 값인지 알 수 없다). 열 이름은 thead 와
               같은 사전 키를 써서 한 화면에서 두 이름으로 불리는 일이 없게 한다. */
            return '<tr><td data-th="' + esc(t('ld.admin.codes.th.login', '이메일')) + '"><b>' + esc(c.login_id) + '</b>' +
              (c.already_user ? ' <span class="muted">(' + t('ld.admin.codes.exists', '기존 계정') + ')</span>' : '') + '</td>' +
              '<td data-th="' + esc(t('ld.admin.codes.th.code', '인증코드')) + '"><code style="font-size:15px; letter-spacing:2px;">' + esc(c.code) + '</code></td>' +
              '<td data-th="' + esc(t('ld.admin.codes.th.kind', '용도')) + '">' + esc(kind) + '</td>' +
              '<td data-th="' + esc(t('ld.admin.codes.th.left', '남은시간')) + '">' + nf(c.minutes_left) + t('ld.admin.codes.min', '분') + '</td>' +
              '<td data-th="' + esc(t('ld.admin.codes.th.try', '시도')) + '">' + nf(c.attempts) + ' / ' + nf(5) + '</td>' +
              '<td class="ta-r act" data-th="' + esc(t('ld.admin.th.act', '관리')) + '"><button class="btn btn-ghost btn-xs" data-i18n="ld.admin.codes.extend" data-ext="' + esc(c.id) + '">' +
              t('ld.admin.codes.extend', '30분 연장') + '</button></td></tr>';
          }).join('');
          codeRows.querySelectorAll('[data-ext]').forEach(function (b) {
            b.onclick = function () {
              b.disabled = true;
              A.adminExtendCode(b.dataset.ext).then(function (r2) {
                show(r2 && r2.ok
                  ? t('ld.admin.codes.extended', '유효시간을 30분 연장했습니다.')
                  : ((r2 && r2.error) || t('ld.admin.msg.fail', '실패')), r2 && r2.ok ? 'ok' : 'err');
                loadCodes();
              });
            };
          });
        }).catch(function () {
          /* 프라미스가 거절되면 예전엔 표가 빈 채로 남아 '대기 코드 0건' 처럼 보였다.
             0건이라고 지어내지 않고, 못 불러왔다는 사실을 그대로 적는다. */
          codeNote(esc(t('ld.admin.codes.fail', '인증코드를 불러오지 못했습니다.')));
        });
      }
      /* ── 임시 비밀번호 입력 모달 ──────────────────────────────────────────
         예전엔 브라우저 prompt() 로 받았다. prompt 는 (1) 입력 글자가 평문 그대로 보여
         어깨너머·화면공유·녹화에 임시 비밀번호가 그대로 노출되고, (2) 확인 입력이 없어
         오타를 친 채 확정되면 관리자도 본인도 그 계정으로 못 들어가며, (3) 브라우저가
         비밀번호 입력으로 취급하지 않아 자동완성·붙여넣기 도움도 못 받는다.
         → 사이트 모달로 바꾼다: type=password + autocomplete=new-password + 확인 입력 +
           규칙 검증, 오류는 틀린 입력 바로 아래에 문구로(색만으로 알리지 않는다). */
      function askTempPw() {
        return new Promise(function (resolve) {
          var prev = document.activeElement;
          var m = document.createElement('div');
          m.className = 'sess-mask';                 /* 세션 대화상자와 같은 오버레이 규칙 */
          m.setAttribute('role', 'dialog');
          m.setAttribute('aria-modal', 'true');
          m.setAttribute('aria-labelledby', 'pwdTitle');
          m.innerHTML =
            '<div class="sess-box pwd-dlg">' +
              /* 이 화면의 제목은 h1 하나뿐이라 대화상자 제목은 h2 로 둔다(h3 이면 한 단이 빈다).
                 모양은 .sess-t 클래스가 잡으므로 태그를 바꿔도 보이는 것은 그대로다. */
              '<h2 class="sess-t" id="pwdTitle">' + esc(t('ld.admin.pw.title', '임시 비밀번호 설정')) + '</h2>' +
              '<p class="sess-d">' + esc(t('ld.admin.pw.desc', '8자 이상, 특수문자를 포함해야 합니다. 전달한 뒤 본인이 바로 바꾸도록 안내하십시오.')) + '</p>' +
              '<div class="auth-form">' +
                '<label for="pwdNew">' + esc(t('ld.admin.pw.new', '새 임시 비밀번호')) +
                  '<input type="password" id="pwdNew" autocomplete="new-password" autocapitalize="off" spellcheck="false" aria-describedby="pwdErr1">' +
                '</label>' +
                '<p class="pwd-err" id="pwdErr1" role="alert" hidden></p>' +
                '<label for="pwdCk">' + esc(t('ld.admin.pw.confirm', '한 번 더 입력')) +
                  '<input type="password" id="pwdCk" autocomplete="new-password" autocapitalize="off" spellcheck="false" aria-describedby="pwdErr2">' +
                '</label>' +
                '<p class="pwd-err" id="pwdErr2" role="alert" hidden></p>' +
              '</div>' +
              '<div class="sess-act">' +
                '<button type="button" class="btn primary" id="pwdOk">' + esc(t('ld.admin.pw.ok', '재설정')) + '</button>' +
                '<button type="button" class="btn" id="pwdNo">' + esc(t('ld.admin.pw.cancel', '취소')) + '</button>' +
              '</div>' +
            '</div>';
          document.body.appendChild(m);

          var i1 = m.querySelector('#pwdNew'), i2 = m.querySelector('#pwdCk');
          var e1 = m.querySelector('#pwdErr1'), e2 = m.querySelector('#pwdErr2');

          /* 테두리 색만 바꾸면 색을 못 보는 사람에게는 아무 일도 안 일어난 화면이다.
             문구를 반드시 함께 띄우고 aria-invalid 로 보조기기에도 같은 사실을 전한다. */
          function mark(inp, box, txt) {
            if (txt) { box.textContent = txt; box.hidden = false; inp.setAttribute('aria-invalid', 'true'); }
            else { box.textContent = ''; box.hidden = true; inp.removeAttribute('aria-invalid'); }
          }
          function done(v) {
            document.removeEventListener('keydown', onKey, true);
            if (m.parentNode) m.parentNode.removeChild(m);
            try { if (prev && prev.focus) prev.focus(); } catch (err) { /* 사라진 버튼이면 그냥 넘어간다 */ }
            resolve(v);
          }
          function submit() {
            var pw = i1.value, ck = i2.value;
            mark(i1, e1, ''); mark(i2, e2, '');
            if (!pw) { mark(i1, e1, t('ld.admin.pw.err.empty', '임시 비밀번호를 입력하세요.')); i1.focus(); return; }
            if (!A.pwStrength(pw).ok) { mark(i1, e1, t('auth.msg.pwRule', '비밀번호는 8자 이상 + 특수문자를 포함해야 합니다.')); i1.focus(); return; }
            /* prompt 에는 없던 검사 — 오타로 아무도 모르는 비밀번호가 박히는 것을 막는다. */
            if (pw !== ck) { mark(i2, e2, t('ld.admin.pw.err.mismatch', '두 입력이 서로 다릅니다.')); i2.focus(); return; }
            done(pw);
          }
          function onKey(ev) {
            if (ev.key === 'Escape') { ev.preventDefault(); done(null); return; }
            if (ev.key === 'Enter' && m.contains(ev.target)) { ev.preventDefault(); submit(); return; }
            /* 모달 밖으로 초점이 새면 뒤에 깔린 표의 버튼을 눌러 버릴 수 있다 — 안에 가둔다. */
            if (ev.key === 'Tab') {
              var f = m.querySelectorAll('input, button');
              if (!f.length) return;
              var first = f[0], last = f[f.length - 1];
              if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
              else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
            }
          }
          document.addEventListener('keydown', onKey, true);
          m.querySelector('#pwdOk').onclick = submit;
          m.querySelector('#pwdNo').onclick = function () { done(null); };
          m.addEventListener('mousedown', function (ev) { if (ev.target === m) done(null); });
          /* 고치기 시작하면 오류 표시를 지운다 — 다 고친 뒤에도 빨간 채면 뭘 더 봐야 하는지 모른다. */
          i1.addEventListener('input', function () { mark(i1, e1, ''); });
          i2.addEventListener('input', function () { mark(i2, e2, ''); });
          /* ★ 초점은 상자를 붙이자마자 준다(2026-09-08). setTimeout 뒤로만 미루면 그 틈에
             들어온 키 입력이 **뒤에 깔린 버튼**으로 가서 같은 대화상자가 한 번 더 열린다
             (Enter 로 버튼을 눌러 연 경우 실제로 재현된다). 늦은 호출은 안전망으로만 남긴다. */
          try { i1.focus(); } catch (err) { /* */ }
          setTimeout(function () { try { if (!m.contains(document.activeElement)) i1.focus(); } catch (err) { /* */ } }, 0);
        });
      }

      /* ── 화면 안 대화상자(되묻기·사유 입력) ────────────────────────────
         네이티브 prompt()/confirm() 은 (1) 테마·언어를 못 따라가 다크 화면에 흰 시스템
         상자가 뜨고, 버튼 글자는 우리가 문구를 번역해도 브라우저 언어로 나오며
         (2) 모바일에서 페이지를 통째로 멈춰 세운다. 그래서 이 저장소는 오래전부터
         사이트 모달로 걷어내 왔다(바로 위 임시 비밀번호 모달 · js/clp.js 의 confirmAsk).
         이 화면에 마지막으로 남아 있던 두 곳(차단 사유·승인취소)도 같은 상자로 옮긴다.
         상자·오버레이는 세션 만료 대화상자(.sess-mask/.sess-box)를 그대로 쓰고,
         포커스 가두기·Escape·부른 자리로 복귀 규약도 위 askTempPw 와 같게 맞춘다. */
      function admDialog(o) {
        return new Promise(function (resolve) {
          var prev = document.activeElement;
          var m = document.createElement('div');
          m.className = 'sess-mask';                 /* 세션 대화상자와 같은 오버레이 규칙 */
          m.setAttribute('role', 'dialog');
          m.setAttribute('aria-modal', 'true');
          m.setAttribute('aria-labelledby', o.titleId);
          if (o.descId) m.setAttribute('aria-describedby', o.descId);
          m.innerHTML = o.html;
          document.body.appendChild(m);

          function done(v) {
            document.removeEventListener('keydown', onKey, true);
            if (m.parentNode) m.parentNode.removeChild(m);
            /* 닫은 뒤 초점이 <body> 로 튀면 키보드 사용자가 어디에 있었는지 잃는다.
               표를 다시 그리면서 그 버튼이 사라졌을 수도 있어 존재를 확인하고 돌려준다. */
            try { if (prev && prev.focus && document.contains(prev)) prev.focus(); } catch (err) { /* 사라졌으면 넘어간다 */ }
            resolve(v);
          }
          function ok() { done(o.value ? o.value(m) : true); }
          function onKey(ev) {
            if (ev.key === 'Escape') { ev.preventDefault(); done(o.no); return; }
            /* 버튼 위에서의 Enter 는 브라우저가 그 버튼을 누른다 — 여기서 가로채면
               '취소'에 손을 얹고 Enter 를 친 사람에게 '확인'이 실행된다.
               그래서 입력칸에서 친 Enter 만 확인으로 받는다. */
            if (ev.key === 'Enter' && m.contains(ev.target) && ev.target.tagName === 'INPUT') { ev.preventDefault(); ok(); return; }
            if (ev.key !== 'Tab') return;
            /* 초점이 모달 밖으로 새면 뒤에 깔린 표의 버튼을 눌러 버릴 수 있다 — 안에 가둔다. */
            var f = m.querySelectorAll('input, button');
            if (!f.length) return;
            var first = f[0], last = f[f.length - 1];
            if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
            else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
          }
          document.addEventListener('keydown', onKey, true);
          m.querySelector('[data-dlg-ok]').onclick = ok;
          m.querySelector('[data-dlg-no]').onclick = function () { done(o.no); };
          /* 바깥을 눌러 닫는 것도 '취소'다 — 되돌릴 수 없는 동작이 실수로 실행되면 안 된다. */
          m.addEventListener('mousedown', function (ev) { if (ev.target === m) done(o.no); });
          /* ★ 초점은 상자를 붙이자마자 준다. 미루면 그 틈에 들어온 키 입력이 뒤에 깔린
             버튼으로 가서 같은 대화상자가 한 번 더 열린다(2026-09-08 실측).
             늦은 호출은 레이아웃이 늦게 잡히는 경우를 위한 안전망으로만 남긴다. */
          function focusIn() {
            try { ((o.focus && m.querySelector(o.focus)) || m.querySelector('[data-dlg-no]')).focus(); } catch (err) { /* */ }
          }
          focusIn();
          setTimeout(function () { if (!m.contains(document.activeElement)) focusIn(); }, 0);
        });
      }

      /* 보안차단 — '사유'를 받아야 하므로 입력이 있는 모양이다.
         예전 prompt(문구, 기본값) 과 같은 약속을 그대로 지킨다: 기본값이 미리 채워져 있고,
         취소하면 null 이라 아무 일도 하지 않으며, 사유를 비운 채 확정해도 그대로 보낸다
         (TWAUTH.adminSetSecurity 가 빈 값을 null 로 바꿔 보낸다 — '사유 없음'과 같다).
         ★ 기본값 문구는 예전에도 t() 를 거치고 있었다. 사전에 키가 없어 어느 언어로 봐도
           한국어로 떴을 뿐이라, 키를 채우면 코드는 이대로 두면 된다. */
      function askBlockReason(login) {
        return admDialog({
          titleId: 'blkTitle', descId: 'blkDesc', focus: '#blkReason', no: null,
          value: function (m) { return m.querySelector('#blkReason').value; },
          html:
            '<div class="sess-box adm-dlg">' +
              /* 이 화면의 제목은 h1 하나뿐이라 대화상자 제목은 h2 로 둔다(askTempPw 와 같다). */
              '<h2 class="sess-t" id="blkTitle">' + esc(t('ld.admin.btn.block', '보안차단')) + '</h2>' +
              '<p class="sess-d" id="blkDesc">' +
                /* 표의 한 줄에서 눌렀는데 상자가 화면을 덮는다 — 어느 계정인지 다시 적는다. */
                (login ? '<b>' + esc(login) + '</b><br>' : '') +
                esc(t('ld.admin.block.desc', '입력한 사유는 이 계정의 보안 상태 설명에 남습니다.')) +
              '</p>' +
              '<div class="auth-form">' +
                '<label for="blkReason">' + esc(t('ld.admin.prompt.blockReason', '차단 사유를 입력하세요.')) +
                  '<input type="text" id="blkReason" autocomplete="off" spellcheck="false" value="' +
                    esc(t('ld.admin.sec.manual', '관리자 수동 차단')) + '">' +
                '</label>' +
              '</div>' +
              '<div class="sess-act">' +
                '<button type="button" class="btn primary" data-dlg-ok>' + esc(t('ld.admin.btn.block', '보안차단')) + '</button>' +
                '<button type="button" class="btn" data-dlg-no>' + esc(t('ld.admin.pw.cancel', '취소')) + '</button>' +
              '</div>' +
            '</div>'
        });
      }

      /* 승인취소 — 예/아니오뿐이라 입력이 없는 모양이다(차단 사유와 다른 점).
         ★ 사전 문구에 줄바꿈(\n)이 들어 있다. confirm 은 이것을 줄로 나눴지만 HTML 은
           아니므로, 이스케이프한 **뒤에** 줄 단위로 <br> 로 잇는다
           (먼저 <br> 을 넣고 이스케이프하면 태그가 글자 그대로 보인다).
         ★ 처음 초점은 '취소' 쪽에 둔다 — 되돌릴 수 없는 쪽에 손이 먼저 가면 안 된다
           (admDialog 는 focus 를 안 주면 [data-dlg-no] 에 초점을 준다). */
      function askRevoke(login) {
        var body = String(t('ld.admin.confirm.revoke',
          '승인을 취소하면 이 계정의 로그인 세션이 모든 기기에서 즉시 종료됩니다.\n다시 승인해도 세션은 복구되지 않아 재로그인이 필요합니다.\n계속할까요?'))
          .split('\n').map(function (ln) { return esc(ln); }).join('<br>');
        return admDialog({
          titleId: 'revTitle', descId: 'revBody', no: false,
          html:
            '<div class="sess-box adm-dlg">' +
              '<h2 class="sess-t" id="revTitle">' + esc(t('ld.admin.btn.revoke', '승인취소')) + '</h2>' +
              '<p class="sess-d" id="revBody">' + (login ? '<b>' + esc(login) + '</b><br>' : '') + body + '</p>' +
              '<div class="sess-act">' +
                /* '취소' 옆에 '승인취소'가 나란히 서면 어느 쪽이 무슨 뜻인지 헷갈린다 —
                   실행 버튼은 문장형으로 따로 적는다. */
                '<button type="button" class="btn primary" data-dlg-ok>' + esc(t('ld.admin.confirm.revokeOk', '승인 취소하기')) + '</button>' +
                '<button type="button" class="btn" data-dlg-no>' + esc(t('ld.admin.pw.cancel', '취소')) + '</button>' +
              '</div>' +
            '</div>'
        });
      }

      /* 선택 상태는 class 와 aria-pressed 를 **같이** 갱신한다. 한쪽만 바꾸면
         화면과 보조기기가 서로 다른 말을 하게 된다. */
      document.querySelectorAll('#filterSeg .seg-btn').forEach(function (b) {
        b.onclick = function () {
          document.querySelectorAll('#filterSeg .seg-btn').forEach(function (x) {
            var on = x === b;
            x.classList.toggle('active', on);
            x.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          filter = b.dataset.f; render();
        };
      });

      /* 표 본문을 통째로 한 줄짜리 안내로 바꾼다. colspan 은 실제 열 수와 맞춰야 한다
         — 이 표는 8열(이메일·이름/부서·상태·권한·보안·신청일·승인일·관리)이다.
         예전엔 로딩 행만 7 로 적혀 있어 마지막 열이 표 밖으로 삐져나왔다. */
      var USER_COLS = 8;
      function userNote(html, cls) {
        rows.innerHTML = '<tr><td colspan="' + USER_COLS + '" class="' + (cls || 'muted') +
          '" style="text-align:center;padding:24px">' + html + '</td></tr>';
      }

      function load() {
        userNote(t('ld.admin.loading', '불러오는 중…'));
        A.adminList().then(function (r) {
          if (!Array.isArray(r)) {
            /* ★ 예전엔 토스트만 띄우고 끝냈다 — 토스트는 3.5초 뒤 사라지고 표는 '불러오는 중…'
               에 영원히 멈춰, 아직 로딩 중인지 실패한 것인지 구분할 수 없었다.
               실패 분기에서 표 본문 자체를 오류 행으로 교체한다. */
            var m = (r && r.error) ? String(r.error) : t('ld.admin.msg.listFail', '목록 조회 실패');
            show(m, 'err');
            userNote(esc(m));
            return;
          }
          ALL = r; render();
        }).catch(function () {
          /* 네트워크 끊김 등으로 프라미스가 거절되는 경우도 같은 자리에서 끝맺는다. */
          show(t('ld.admin.msg.listFail', '목록 조회 실패'), 'err');
          userNote(esc(t('ld.admin.msg.listFail', '목록 조회 실패')));
        });
      }
      function render() {
        var list = ALL.filter(function (u) { return filter === 'all' ? true : u.status === filter; });
        if (!list.length) { userNote(t('ld.admin.empty', '해당 항목이 없습니다.')); return; }
        rows.innerHTML = list.map(function (u) {
          /* ★ 날짜는 KST 로 찍는다. toLocaleDateString 은 보는 사람 PC 시간대를 따라가
             같은 계정이 자리마다 다른 날로 보인다 — 집계(app_admin_usage)도 KST 기준이다.
             공용 TWI18N.dt 가 KST 고정 + 현재 언어 서식을 함께 해 주므로 그걸 쓴다.
             다만 전역이 없을 수도 있어 예전의 수동 KST 계산을 폴백으로 남긴다
             (그래야 어느 경우에도 PC 시간대로 새지 않는다). */
          function ymdKst(iso) {
            if (!iso) return '—';
            if (window.TWI18N && TWI18N.dt) {
              var s = TWI18N.dt(iso, { form: 'ymd' });
              return (s && s !== '-') ? s : '—';
            }
            var v = new Date(iso);
            if (isNaN(v.getTime())) return '—';
            var k = new Date(v.getTime() + 9 * 3600000);
            return k.getUTCFullYear() + '-' + ('0' + (k.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + k.getUTCDate()).slice(-2);
          }
          var ds = ymdKst(u.created_at);
          /* ★ 비어 있으면 '—' 로 둔다. 신청일로 대신 채우면 승인일을 지어내는 것이 된다
             (수기로 만든 계정은 approved_at 이 비어 있을 수 있다). */
          var as = ymdKst(u.approved_at);
          var isAdmin = u.role === 'admin';
          var sec = u.security_status || 'normal';
          var secLb = sec === 'blocked' ? t('ld.admin.sec.blocked', '차단') : (sec === 'watch' ? t('ld.admin.sec.watch', '주의') : t('ld.admin.sec.normal', '정상'));
          var secTitle = [
            /* ★ 예전엔 (u.risk_score || 0) 이라 **점수를 안 받아온 계정도 0 점**으로 보였다.
               측정하지 않은 값을 0 으로 지어내지 않는다 — nf 는 없는 값에 '-' 를 돌려준다. */
            t('ld.admin.sec.risk', '위험도') + ': ' + nf(u.risk_score),
            u.last_ip ? 'IP: ' + u.last_ip : '',
            u.blocked_reason ? t('ld.admin.sec.reason', '사유') + ': ' + u.blocked_reason : ''
          ].filter(Boolean).join(' · ');
          var secCell = '<span class="st-pill st-' + (sec === 'blocked' ? 'rejected' : sec === 'watch' ? 'pending' : 'approved') + '" title="' + esc(secTitle) + '">' + esc(secLb) + '</span>';
          var act = isAdmin ? '<span class="muted">' + t('ld.admin.role.admin', '관리자') + '</span>' :
            '<div class="row-act">' +
              (u.status !== 'approved' ? '<button class="btn btn-primary btn-xs" data-act="approved" data-id="' + u.id + '" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.approve', '승인') + '</button>' : '') +
              (u.status !== 'rejected' ? '<button class="btn btn-ghost btn-xs" data-act="rejected" data-id="' + u.id + '" data-cur="' + esc(u.status) + '" data-login="' + esc(u.login) + '">' + (u.status === 'approved' ? t('ld.admin.btn.revoke', '승인취소') : t('ld.admin.btn.reject', '거부')) + '</button>' : '') +
              (sec !== 'blocked' ? '<button class="btn btn-ghost btn-xs" data-act="block" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.block', '보안차단') + '</button>' : '<button class="btn btn-ghost btn-xs" data-act="unblock" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.unblock', '차단해제') + '</button>') +
              (sec !== 'watch' && sec !== 'blocked' ? '<button class="btn btn-ghost btn-xs" data-act="watch" data-login="' + esc(u.login) + '">' + t('ld.admin.btn.watch', '주의') + '</button>' : '') +
              '<button class="btn btn-ghost btn-xs" data-act="reset" data-id="' + u.id + '">' + t('ld.admin.btn.resetPw', '비번재설정') + '</button>' +
            '</div>';
          /* data-th — 좁은 폭에서 행이 카드로 접힐 때 각 칸이 스스로 자기 열 이름을 단다.
             ★ 375px 에서 이 표는 카드(325px)보다 530~825px 이나 넓어 '관리' 열이 통째로
               화면 밖에 있었고(2026-09-08 실측: 버튼 4개 중 화면 안 0개), 거기까지 가로로
               밀면 이메일·이름 열이 반대로 밖으로 나가 **누구 줄인지 모른 채** 승인을
               누르게 됐다. 열을 빼지 않고 행을 세워, 값도 버튼도 전부 한 화면에 둔다.
             열 이름은 thead 와 같은 사전 키를 쓴다 — 한 화면에서 두 이름으로 불리면 안 된다. */
          return '<tr><td data-th="' + esc(t('ld.admin.th.login', '이메일(아이디)')) + '"><b>' + esc(u.login) + '</b></td>' +
            '<td data-th="' + esc(t('ld.admin.th.name', '이름/부서')) + '">' + esc(u.name || '—') + '</td>' +
            '<td data-th="' + esc(t('ld.admin.th.status', '상태')) + '"><span class="st-pill st-' + u.status + '">' + t('ld.admin.st.' + u.status, ST[u.status] || u.status) + '</span></td>' +
            '<td data-th="' + esc(t('ld.admin.th.role', '권한')) + '">' + (isAdmin ? t('ld.admin.role.admin', '관리자') : t('ld.admin.role.user', '일반')) + '</td>' +
            '<td data-th="' + esc(t('ld.admin.th.security', '보안')) + '">' + secCell + '</td>' +
            '<td data-th="' + esc(t('ld.admin.th.created', '신청일')) + '">' + esc(ds) + '</td>' +
            '<td data-th="' + esc(t('ld.admin.th.approved', '승인일')) + '">' + esc(as) + '</td>' +
            '<td class="ta-r act" data-th="' + esc(t('ld.admin.th.act', '관리')) + '">' + act + '</td></tr>';
        }).join('');
        rows.querySelectorAll('[data-act]').forEach(function (b) {
          b.onclick = function () {
            var id = b.dataset.id, act = b.dataset.act;
            if (act === 'reset') {
              /* 검증은 모달 안에서 끝난다 — 여기까지 온 값은 이미 규칙을 통과하고
                 확인 입력까지 일치한 값이다. 취소하면 null 이 와서 아무 일도 하지 않는다. */
              askTempPw().then(function (pw) {
                if (!pw) return;
                A.adminResetPw(id, pw).then(function (r) {
                  show(r && r.ok ? t('ld.admin.msg.pwReset', '비밀번호를 재설정했습니다.')
                                 : ((r && r.error) || t('ld.admin.msg.fail', '실패')), r && r.ok ? 'ok' : 'err');
                }).catch(function () { show(t('ld.admin.msg.fail', '실패'), 'err'); });
              });
            } else {
              if (act === 'block' || act === 'unblock' || act === 'watch') {
                var login = b.dataset.login;
                var next = act === 'block' ? 'blocked' : (act === 'watch' ? 'watch' : 'normal');
                /* 사유를 묻는 것은 '차단'뿐이다. 해제·주의는 물어볼 것이 없어 바로 진행한다.
                   ★ prompt() 를 사이트 모달로 바꾸면서 되묻기가 비동기가 됐다. 취소는 여전히
                     null 이고, null 이면 아무 일도 하지 않는다 — prompt 때와 같은 약속이다. */
                (act === 'block' ? askBlockReason(login) : Promise.resolve(null)).then(function (reason) {
                  if (act === 'block' && reason === null) return;
                  A.adminSetSecurity(login, next, reason).then(function (r) {
                    if (r && r.ok) { show(t('ld.admin.msg.securitySaved', '보안 상태를 변경했습니다.'), 'ok'); load(); }
                    else { show(r && r.error ? r.error : t('ld.admin.msg.fail', '실패'), 'err'); }
                  });
                });
                return;
              }
              /* 승인취소는 이제 그 사람의 로그인 세션까지 즉시 끊는다(2026-09-03).
                 재승인해도 끊긴 세션은 돌아오지 않는다 — 전 기기 재로그인이 필요하다.
                 같은 줄의 다른 위험 동작(보안차단·비번재설정)은 이미 확인 절차가 있는데
                 이것만 확인 없이 즉시 실행됐다. 부작용을 명시해 되묻는다.
                 ★ confirm() 대신 사이트 모달로 되묻는다. 되묻기가 비동기가 되므로 실행부를
                   함수로 묶고 '예'일 때만 부른다 — '아니오'면 예전처럼 아무 일도 없다. */
              var applyStatus = function () {
                var acctLogin = b.getAttribute('data-login') || (b.closest('tr') && b.closest('tr').getAttribute('data-login')) || '';
                A.adminSetStatus(id, act).then(function (r) {
                  if (r && r.ok) {
                    show(act === 'approved' ? t('ld.admin.msg.approved', '승인했습니다.') : t('ld.admin.msg.rejected', '거부했습니다.'), 'ok');
                    /* 승인한 경우에만 신청자에게 "승인됐습니다" 메일. 서버가 관리자 토큰과 대상
                       상태를 다시 검증하므로, 실패해도 승인 자체는 이미 반영됐다 — 흐름을 막지 않는다. */
                    if (act === 'approved' && acctLogin && A.signupNotifyApproved) A.signupNotifyApproved(acctLogin).catch(function () {});
                    load();
                  } else { show(r && r.error ? r.error : t('ld.admin.msg.fail', '실패'), 'err'); }
                });
              };
              if (act === 'rejected' && b.getAttribute('data-cur') === 'approved') {
                askRevoke(b.getAttribute('data-login') || '').then(function (yes) { if (yes) applyStatus(); });
                return;
              }
              applyStatus();
            }
          };
        });
      }
    })();
  </script>
</body>
</html>
