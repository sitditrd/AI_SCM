# Netlify 배포 설정 — GitHub Pages 워크플로와 동일하게 웹 파일만 선별 게시
# (사업문서 PRJ_2026·수집기 scripts·sql 덤프가 사이트 도메인으로 노출되지 않도록 publish="." 금지)
[build]
  command = "mkdir -p _site && cp *.html sitemap.xml robots.txt _site/ && for d in css js assets routes; do [ -d \"$d\" ] && cp -r \"$d\" _site/; done; true"
  publish = "_site"

# 주의: /api/* 백엔드(server.py — 유니패스 화물추적, searoute 경로계산)는
# 로컬 실행 전용이라 Netlify 배포판에서는 동작하지 않는다.
# 해당 페이지는 백엔드 미연결 시 안내 문구를 표시하도록 이미 처리되어 있음.
# (필요 시 Netlify Functions(Node) 포팅으로 유니패스 프록시 이관 가능)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# HTML은 캐시버스팅(?v=)이 없으므로 항상 재검증 — 제목·내용 변경이 즉시 반영되도록
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 정적 자산(css/js/assets)은 ?v= 캐시버스팅을 쓰므로 장기 캐시 허용
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
