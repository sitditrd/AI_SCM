  <style>

        <div class="pw-meter" id="pw-reset" role="status" aria-live="polite" hidden>

<!-- ★ 이 화면은 외부 스크립트 뒤에 인라인 <script> 가 온다. defer 를 붙이면 인라인이
     먼저 실행돼 TWAUTH·TWI18N 등이 아직 없는 상태로 돌아 화면이 죽는다. 그대로 둔다. -->
  <script src="js/common.js?v=2026-09-12-quota"></script>
  <script src="js/i18n.js?v=2026-09-12-mailsee"></script>
  <script src="js/auth.js?v=2026-09-11-watch"></script>
  <script>
    (function () {
      var A = window.TWAUTH;
      function t(k, ko) { return (window.TWI18N && window.TWI18N.t) ? window.TWI18N.t(k, ko) : ko; }
      var msg = document.getElementById('msg');
      function show(text, kind) { msg.hidden = false; msg.textContent = text; msg.className = 'auth-msg ' + (kind || ''); }
      function clearMsg() { msg.hidden = true; }
      function domainDeniedMsg() { return t('auth.msg.domainDeniedShort', '허용되지 않는 도메인입니다.'); }
      function authError(r, fallback) {
        var s = r && r.error ? String(r.error) : '';
        if (/외부 메일 도메인|허용되지 않는 도메인|not permitted|domain/i.test(s)) return domainDeniedMsg();
        return s || fallback;
      }

      /* ── 칸별 오류 ─────────────────────────────────────────────────────────
         예전엔 모든 오류가 폼 맨 위 전역 상자(#msg) 하나로만 떴다. 어느 칸이 틀렸는지
         화면으로도 알기 어려웠고, 스크린리더 사용자는 입력 칸에 머문 채로는 아무것도
         듣지 못했다. 이제 칸마다 오류 자리를 두고 aria-describedby 로 이어,
         실패한 칸에 aria-invalid 를 걸고 첫 오류 칸으로 포커스를 옮긴다.
         전역 상자는 그대로 둔다 — 요약(전역)과 상세(칸별)는 서로를 대체하지 않는다. */
      function errSlot(input) { var id = input.getAttribute('aria-describedby'); return id ? document.getElementById(id) : null; }
      function clearField(input) { input.removeAttribute('aria-invalid'); var e = errSlot(input); if (e) e.textContent = ''; }
      function clearFields(form) { [].forEach.call(form.querySelectorAll('input[aria-describedby]'), clearField); }
      /* 타이핑을 시작하면 그 칸의 오류 표시를 즉시 거둔다 — 고친 뒤에도 빨간 채로 남으면 거짓말이 된다. */
      [].forEach.call(document.querySelectorAll('.auth-form input[aria-describedby]'), function (inp) {
        inp.addEventListener('input', function () { if (inp.hasAttribute('aria-invalid')) clearField(inp); });
      });
      /* errs = [[input, 문구], …]. 전부 표시하되 포커스는 첫 칸으로만 옮긴다. */
      function reportFields(form, errs) {
        clearFields(form);
        if (!errs.length) return true;
        errs.forEach(function (x) { x[0].setAttribute('aria-invalid', 'true'); var e = errSlot(x[0]); if (e) e.textContent = x[1]; });
        show(errs[0][1], 'err');
        try { errs[0][0].focus(); } catch (_) { /* 숨은 폼 등 포커스 불가 — 문구는 이미 붙었다 */ }
        return false;
      }
      function collect(pairs) {
        var out = [];
        pairs.forEach(function (p) { var m = p[1](p[0]); if (m) out.push([p[0], m]); });
        return out;
      }
      /* novalidate 로 끈 브라우저 기본 검사를 같은 조건으로 여기서 되살린다(빠뜨리면 검증이 준다). */
      var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      function vEmail(i) {
        var v = i.value.trim();
        if (!v) return t('auth.err.emailRequired', '이메일을 입력하세요.');
        return EMAIL_RE.test(v) ? '' : t('auth.msg.emailFormat', '이메일 형식을 확인하세요.');
      }
      function vCode(i) {
        var v = i.value.trim();
        if (!v) return t('auth.err.codeRequired', '인증코드를 입력하세요.');
        return /^[0-9]{6}$/.test(v) ? '' : t('auth.err.codeFormat', '인증코드는 숫자 6자리입니다.');
      }
      function vPwRequired(i) { return i.value ? '' : t('auth.err.pwRequired', '비밀번호를 입력하세요.'); }

      /* 탭 전환 — 보이는 상태(class)와 보조기기 상태(aria-selected)를 같이 옮긴다.
         예전엔 class 만 바꿔서, 화면에는 선택이 보이는데 스크린리더에는 셋 다 선택 안 됨으로 들렸다.
         role=tablist 를 선언했으면 좌우 화살표 이동도 같이 지켜야 한다(로빙 tabindex). */
      var TABS = [].slice.call(document.querySelectorAll('.auth-tab'));
      function selectTab(t, focus) {
        TABS.forEach(function (x) {
          var on = (x === t);
          x.classList.toggle('active', on);
          x.setAttribute('aria-selected', on ? 'true' : 'false');
          x.tabIndex = on ? 0 : -1;
        });
        clearMsg();
        /* 탭을 옮기면 앞 폼에 남은 칸별 오류도 같이 거둔다 — 전역 상자만 지우면 빨간 칸이 남는다. */
        ['login', 'signup', 'reset'].forEach(function (k) { var f = document.getElementById('f-' + k); clearFields(f); f.hidden = (k !== t.dataset.tab); });
        if (focus) t.focus();
      }
      TABS.forEach(function (t, i) {
        t.addEventListener('click', function () { selectTab(t, false); });
        t.addEventListener('keydown', function (e) {
          var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
          if (d) { e.preventDefault(); selectTab(TABS[(i + d + TABS.length) % TABS.length], true); return; }
          if (e.key === 'Home') { e.preventDefault(); selectTab(TABS[0], true); }
          if (e.key === 'End') { e.preventDefault(); selectTab(TABS[TABS.length - 1], true); }
        });
      });

      /* 비밀번호 강도 미터
         ★ 예전엔 타이핑에 따라 막대·문구가 바뀌는데 보조기술에는 아무 알림이 없었다.
           미터 상자에 role=status / aria-live=polite 를 붙였고(HTML), 막대는 progressbar 로
           만들어 여기서 aria-valuenow(0~5)와 aria-valuetext(말로 된 강도)를 같이 갱신한다.
         ★ 다만 라이브 영역이라 매 글자마다 읽어 주면 입력을 방해한다. 그래서 문구가
           **실제로 바뀔 때만** 텍스트 노드를 교체한다(같은 값을 다시 넣어도 변경으로 잡힌다). */
      function bindMeter(formId, meterId) {
        var f = document.getElementById(formId), box = document.getElementById(meterId);
        var input = f.querySelector('input[name="password"]');
        var bar = box.querySelector('.pw-bar'), fill = box.querySelector('.pw-bar span'), lab = box.querySelector('.pw-label');
        input.addEventListener('input', function () {
          var v = input.value; box.hidden = !v;
          var s = A.pwStrength(v);
          fill.style.width = (s.score * 20) + '%';
          fill.style.background = s.color;
          var text = t('auth.pw.strengthLabel', '강도: ') + t(s.key, s.label) + (s.checks.special ? '' : t('auth.pw.needSpecial', ' · 특수문자 필요'));
          if (lab.textContent !== text) lab.textContent = text;   /* 바뀔 때만 → 불필요한 낭독을 막는다 */
          lab.style.color = s.txt;
          bar.setAttribute('aria-valuenow', String(s.score));
          bar.setAttribute('aria-valuetext', text);               /* 숫자만 읽히면 뜻이 없다 — 말도 같이 준다 */
          box.querySelectorAll('.pw-checks li').forEach(function (li) { li.classList.toggle('on', !!s.checks[li.dataset.k]); });
        });
      }
      bindMeter('f-signup', 'pw-signup'); bindMeter('f-reset', 'pw-reset');

      /* ★ 가입 허용 도메인 목록을 여기에 두지 마라.
         예전엔 제휴사 도메인 6개를 배열로 갖고 있었다. 검증 목적으로는 무의미했다 —
         서버(send-code · app_signup_verified)가 최종 권위라 클라이언트 값을 지워도 우회가 안 된다.
         반면 공개 로그인 화면에 그룹 구성이 그대로 드러났다. 얻는 것 없이 잃기만 하는 코드였다.
         지금은 형식만 보고 넘기고, 도메인 판정은 서버가 한다. 서버가 거부하면 아래
         authError() 가 같은 문구로 받아 준다(116행). 잃는 것은 왕복 1회분의 즉시 안내뿐이다. */

      /* 인증코드 발송 */
      document.querySelectorAll('[data-send]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var form = btn.closest('form'); var login = form.login.value.trim();
          /* 여기서도 오류를 이메일 칸에 붙인다 — 예전엔 전역 상자만 떠서, 버튼 옆 칸을 고쳐야 한다는 걸 알기 어려웠다. */
          var m = vEmail(form.login);
          if (m) { reportFields(form, [[form.login, m]]); return; }
          /* 앞선 쿨다운의 타이머가 남아 있으면 먼저 끈다. 남겨 두면 그 tick 이
             '발송중…' 이나 새 결과 문구 위에 옛 '재발송(N)' 을 덮어써서, 버튼이
             제 상태와 다른 말을 한다(실측으로 재현했다). */
          if (btn._cdIv) { clearInterval(btn._cdIv); btn._cdIv = null; }
          btn.disabled = true; btn.textContent = t('auth.sending', '발송중…');
          var send = btn.dataset.send === 'reset' ? A.resetSendCode(login) : A.signupSendCode(login);
          /* ★ 쿨다운은 '보냈다' 가 사실일 때만 건다(2026-09-08 교정).
             예전엔 이 블록이 .finally() 안에 있어 결과와 무관하게 항상 돌았다. 실측하면
             발송 실패 직후에도 버튼이 {txt:'재발송(29)', disabled:true} 였다 — 같은 순간
             위쪽 배너는 빨간 오류였는데도. 화면이 두 가지를 동시에 말한 셈이고,
             더 나쁜 것은 보내지도 않은 코드 때문에 30초간 재시도가 막힌 점이다.
             (오프라인·서버오류·도메인 거부가 전부 이 경로로 온다.)
             지금은 성공만 쿨다운, 실패는 즉시 다시 누를 수 있게 되돌린다. */
          function idle() {
            if (btn._cdIv) { clearInterval(btn._cdIv); btn._cdIv = null; }
            btn.setAttribute('data-i18n', 'auth.getcode');
            btn.disabled = false;
            btn.textContent = t('auth.getcode', '인증코드 받기');
          }
          function cooldown() {
            var n = 30;
            /* ★ 쿨다운 동안에는 사전 표시를 뗀다. 이 버튼에는 data-i18n="auth.getcode" 가
               달려 있어서, 세는 중에 헤더에서 언어를 바꾸면 i18n apply() 가 글자를
               '인증코드 받기' 로 되돌린다 — 눌리지도 않는 버튼이 누르라고 말하게 된다.
               떼어 두면 다음 1초 tick 이 바뀐 언어의 '재발송(N)' 으로 다시 쓴다. */
            btn.removeAttribute('data-i18n');
            btn.textContent = t('auth.resend', '재발송(%s)').replace('%s', n);
            btn._cdIv = setInterval(function () {
              n--;
              btn.textContent = t('auth.resend', '재발송(%s)').replace('%s', n);
              if (n <= 0) idle();       /* idle() 이 타이머까지 정리한다 */
            }, 1000);
          }
          send.then(function (r) {
            if (r && r.ok) { show(t('auth.msg.codeSent', '인증코드를 메일로 보냈습니다. 30분 내 입력하세요.'), 'ok'); cooldown(); }
            else { show(authError(r, t('auth.msg.sendFail', '발송 실패')), 'err'); idle(); }
          }, function () {
            /* edge() 가 네트워크 오류를 이미 객체로 바꿔 주므로 여기까지 오는 일은 드물다.
               그래도 남겨 둔다 — 예상 못 한 예외로 거부되면 버튼이 '발송중…' 인 채 영영 잠긴다. */
            show(t('auth.msg.sendFail', '발송 실패'), 'err'); idle();
          });
        });
      });

      /* 왜 로그아웃됐는지 먼저 알린다 — 이유를 안 적으면 사용자는 고장난 줄 안다.
         reason 은 세션 감시가 붙여 보낸다(idle=유휴 만료 · expired=유효시간 상한 · manual=본인 선택). */
      (function showReason() {
        var why = new URLSearchParams(location.search).get('reason');
        if (!why || why === 'manual') return;
        var k = why === 'expired' ? 'auth.msg.expired' : 'auth.msg.idle';
        var ko = why === 'expired'
          ? '로그인 유효시간이 끝나 로그아웃되었습니다. 다시 로그인해 주십시오.'
          : '일정 시간 사용이 없어 자동으로 로그아웃되었습니다. 다시 로그인해 주십시오.';
        show(t(k, ko), 'err');
      })();

      /* 공용 PC 선택 — 이 값만 브라우저에 남고, 세션은 그 선택에 따라 담긴다. */
      (function bindTabOnly() {
        var c = document.getElementById('tabOnly');
        if (!c || !A.tabOnly) return;
        c.checked = A.tabOnly();
        c.addEventListener('change', function () { A.setTabOnly(c.checked); });
      })();

      /* 로그인 */
      document.getElementById('f-login').addEventListener('submit', function (e) {
        e.preventDefault(); clearMsg();
        var f = e.target;
        /* 칸 검사를 버튼 잠금보다 **먼저** 한다 — 잠근 뒤에 되돌아 나가면 버튼만 죽는다. */
        if (!reportFields(f, collect([[f.login, vEmail], [f.password, vPwRequired]]))) return;
        /* ★ 응답이 올 때까지 잠근다. 예전엔 연타하면 로그인 요청이 그만큼 나갔고,
           먼저 보낸 응답이 나중에 도착해 성공/실패가 뒤집혀 보일 수 있었다.
           저장소에 이미 있는 잠금 헬퍼를 쓴다(js/common.js TWUI.hold). */
        var hd = (window.TWUI && TWUI.hold) ? TWUI.hold(f.querySelector('[type=submit]'), 'auth.login') : null;
        function done() { if (hd) hd.end(); }
        /* 저장소 선택을 로그인 저장보다 **먼저** 확정한다 — 나중에 바꾸면 세션이 반대쪽에 담긴다. */
        if (A.setTabOnly) { var cb = document.getElementById('tabOnly'); if (cb) A.setTabOnly(cb.checked); }
        A.login(f.login.value.trim(), f.password.value).then(function (r) {
          done();
          if (r && r.ok) {
            show(t('auth.msg.loginOk', '로그인 성공. 이동합니다…'), 'ok');
            var next = (r.role === 'admin') ? 'admin.html' : 'index.html';
            try {
              var raw = new URLSearchParams(location.search).get('next');
              if (raw) {
                var u = new URL(raw, location.href), file = u.pathname.split('/').pop();
                if (u.origin === location.origin && /^(index|insight|berth|vessel|cargo|clp|route|rate|schedule|status|admin|analytics)\.html$/.test(file) &&
                    (r.role === 'admin' || !/^(status|admin|analytics)\.html$/.test(file))) next = file + u.hash;
              }
            } catch (_) { /* Keep the default destination. */ }
            setTimeout(function () { location.replace(next); }, 500);
          }
          /* 서버가 거절한 경우는 어느 칸이 틀렸는지 우리가 모른다(아이디·비밀번호를 구분해 알려 주지 않는다).
             모르는 것을 아는 척하지 않는다 — 특정 칸에 aria-invalid 를 걸지 않고 전역 상자로만 알린다. */
          else { show(r && r.error ? r.error : t('auth.msg.loginFail', '로그인 실패'), 'err'); }
        }, done);
      });

      /* 회원가입 */
      document.getElementById('f-signup').addEventListener('submit', function (e) {
        e.preventDefault(); clearMsg();
        var f = e.target;
        /* ★ 검사를 버튼 잠금보다 앞으로 옮겼다. 예전엔 잠근 뒤에 강도·일치 검사에서 return 해서,
           틀린 입력을 고쳐도 안전판(12초)이 풀릴 때까지 버튼이 죽어 있었다.
           규칙 위반은 이제 해당 칸(비밀번호 / 비밀번호 확인)에 붙는다. */
        var errs = collect([[f.login, vEmail], [f.code, vCode], [f.password, vPwRequired]]);
        if (!errs.length) {
          if (!A.pwStrength(f.password.value).ok) errs.push([f.password, t('auth.msg.pwRule', '비밀번호는 8자 이상 + 특수문자를 포함해야 합니다.')]);
          if (f.password.value !== f.password2.value) errs.push([f.password2, t('auth.msg.pwMismatch', '비밀번호 확인이 일치하지 않습니다.')]);
        }
        if (!reportFields(f, errs)) return;
        var hd = (window.TWUI && TWUI.hold) ? TWUI.hold(e.target.querySelector('[type=submit]'), 'auth.signup') : null;
        function done() { if (hd) hd.end(); }
        setTimeout(done, 12000);   /* 어떤 분기에서도 영구 잠금이 안 생기게 하는 안전판 */
        var signupEmail = f.login.value.trim();
        A.signup(signupEmail, f.password.value, f.code.value.trim(), f.name.value.trim()).then(function (r) {
          if (r && r.ok) {
            show(t('auth.msg.signupOk', '가입 신청 완료! 관리자 승인 후 로그인할 수 있습니다.'), 'ok'); f.reset();
            /* 관리자에게 승인 요청 메일. 서버가 그 주소를 실제 pending 계정으로 검증한 뒤에만
               보내므로, 여기서 실패해도 가입은 이미 끝난 것이라 사용자 흐름을 막지 않는다. */
            if (A.signupNotifyAdmin) A.signupNotifyAdmin(signupEmail).catch(function () {});
          }
          else { show(authError(r, t('auth.msg.signupFail', '가입 실패')), 'err'); }
        });
      });

      /* 비밀번호 재설정 */
      document.getElementById('f-reset').addEventListener('submit', function (e) {
        e.preventDefault(); clearMsg();
        var f = e.target;
        /* 가입 폼과 같은 이유로 검사를 잠금보다 먼저 한다(잠근 뒤 return 하면 버튼만 12초 죽는다). */
        var errs = collect([[f.login, vEmail], [f.code, vCode], [f.password, vPwRequired]]);
        if (!errs.length && !A.pwStrength(f.password.value).ok) errs.push([f.password, t('auth.msg.pwRule', '비밀번호는 8자 이상 + 특수문자를 포함해야 합니다.')]);
        if (!reportFields(f, errs)) return;
        var hd = (window.TWUI && TWUI.hold) ? TWUI.hold(e.target.querySelector('[type=submit]'), 'auth.reset') : null;
        function done() { if (hd) hd.end(); }
        setTimeout(done, 12000);   /* 어떤 분기에서도 영구 잠금이 안 생기게 하는 안전판 */
        A.reset(f.login.value.trim(), f.code.value.trim(), f.password.value).then(function (r) {
          if (r && r.ok) { show(t('auth.msg.resetOk', '비밀번호가 재설정되었습니다. 로그인해 주세요.'), 'ok'); document.querySelector('.auth-tab[data-tab="login"]').click(); }
          else { show(r && r.error ? r.error : t('auth.msg.resetFail', '재설정 실패'), 'err'); }
        });
      });
    })();
  </script>
</body>
</html>
