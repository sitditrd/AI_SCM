name: Deploy static portal to GitHub Pages

# Netlify 무료 빌드 한도 소진(프로덕션 배포 일시중지) 대체 무료 배포 경로.
# 웹 파일(html·css·js·assets·routes)만 게시. 사업문서(PRJ_2026)·수집기(scripts)는 제외.
# 운영본은 바닐라 정적 사이트(빌드 불필요). React 시안은 SEO·번들·인수인계 복잡도 이유로 채택 보류(2026-07 제거).
# ※ 최초 1회: 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions" 로 설정 필요.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 웹 파일만 _site로 수집
        run: |
          mkdir -p _site
          cp *.html _site/ 2>/dev/null || true
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true
          for d in css js assets routes; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
          ls -1 _site/*.html | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Netlify 미러 배포 트리거 (선택) — 저장소 Settings→Secrets→Actions 에 NETLIFY_BUILD_HOOK 등록 시 자동 발동.
      # (Netlify 빌드 훅 URL: https://api.netlify.com/build_hooks/xxxx). 미설정 시 조용히 건너뜀.
      - name: Trigger Netlify mirror build (optional)
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -sf -X POST -d '{}' "$HOOK" && echo "Netlify 빌드 트리거됨" || echo "Netlify hook 실패 (무시)"
          else
            echo "NETLIFY_BUILD_HOOK 시크릿 미설정 — Netlify 미러 배포 건너뜀"
          fi
